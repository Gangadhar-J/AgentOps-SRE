apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 5s
      evaluation_interval: 5s

    alerting:
      alertmanagers:
      - static_configs:
        - targets: ['alertmanager.monitoring.svc.cluster.local:9093']

    rule_files:
      - '/etc/prometheus/alerts.yml'

    scrape_configs:
    - job_name: 'prometheus'
      static_configs:
      - targets: ['localhost:9090']

    - job_name: 'kubernetes-pods'
      kubernetes_sd_configs:
      - role: pod
      relabel_configs:
      # Only scrape pods annotated with prometheus.io/scrape = true
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      # Extract scrape path
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      # Extract scrape port
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      # Populate standard correlation labels
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: pod
      - source_labels: [__meta_kubernetes_pod_container_name]
        action: replace
        target_label: container
      - source_labels: [__meta_kubernetes_pod_label_app]
        action: replace
        target_label: app
      - source_labels: [__meta_kubernetes_pod_label_service]
        action: replace
        target_label: service
      - source_labels: [__meta_kubernetes_pod_node_name]
        action: replace
        target_label: node

  alerts.yml: |
    groups:
    - name: agentops-demo-alerts
      rules:
      - alert: DemoAppCrashLoop
        expr: sum by (namespace, app) (rate(kube_pod_container_status_restarts_total{app="demo-app"}[2m])) > 0
        for: 10s
        labels:
          severity: critical
        annotations:
          summary: "Pod CrashLoopBackOff detected in {{ $labels.namespace }}/{{ $labels.app }}"
          description: "Workload pods are cycling in restart backoff with non-zero exit codes."

      - alert: DemoAppHighErrorRate
        expr: (sum by (namespace, app) (rate(http_requests_total{app="demo-app", status=~"5.."}[2m])) / sum by (namespace, app) (rate(http_requests_total{app="demo-app"}[2m]))) * 100 > 5
        for: 15s
        labels:
          severity: critical
        annotations:
          summary: "Elevated HTTP 5xx error rate detected in {{ $labels.namespace }}/{{ $labels.app }}"
          description: "HTTP error rate exceeds 5% threshold over a 2m sliding window."
