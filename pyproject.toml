[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agentops-sre"
version = "0.6.0"
description = "AgentOps: Secure AI SRE & Autonomous Incident Remediation Platform"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
    "flask>=3.0.0",
    "gunicorn>=23.0.0",
    "prometheus-client>=0.21.0",
    "requests>=2.32.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "mcp>=2.1.0",
    "pyyaml>=6.0.3",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-timeout>=2.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.9.0",
]

[tool.setuptools.packages.find]
include = ["agentops*", "evaluation*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
asyncio_mode = "auto"
